################################################################################
# 8. NETWORK CONFIGURATION
################################################################################
network:
  # High-level network architecture type
  architectureType: TGW  # Transit Gateway architecture for UK council
  
  # Default VPC handling
  defaultVpc:
    delete: true
    excludeAccounts:
      - Management
  
  # Standard network architecture parameters
  standardArchitecture:
    centralizedNetworking: true
    networkAccount: Network
    region: *HOME_REGION
    
    # High-level VPC structure
    vpcs:
      transitGatewayVpc:
        enabled: true
        availabilityZones: 3
        subnetsPerAZ: 1
        transitGateway: true
        
      endpointVpc:
        enabled: true
        availabilityZones: 3
        subnetsPerAZ: 3  # Regular + TGW attachment + Interface Endpoint subnets
        centralEndpoints: true
        requiredEndpoints:
          - ec2
          - ec2messages
          - ssm
          - ssmmessages
          - kms
          - logs
          - monitoring
          - s3
          - dynamodb
        
      inspectionVpc:
        enabled: true
        availabilityZones: 3
        subnetsPerAZ: 4  # Regular + TGW attachment + Firewall + NAT Gateway subnets
        networkFirewall: true
        firewallPolicy: StrictInspectionPolicy
        
      workloadVpcs:
        enabled: true
        availabilityZones: 3
        subnetsPerAZ: 4  # Web + App + Data + TGW attachment subnets
        deploymentTargets:
          accounts: 
            - CitizenServices
            - InternalSystems
            - SensitiveData
            - Development
            - Testing

    # Connectivity options
    connectivity:
      transitGateway:
        enabled: true
        routeTableStructure: segregated
        routeTables:
          - Core
          - Segregated
          - Shared
          - Inspection
          
      hybridConnectivity:
        enabled: true
        type: VPN
        vpn:
          customerGateways:
            - name: PSN-Connection
              ipAddress: 192.0.2.10  # Example IP - replace with actual PSN endpoint
              bgpAsn: 65000
          attachments:
            - name: PSN-VPN
              customerGatewayName: PSN-Connection
              routingOptions: dynamic
              
      route53Resolver:
        enabled: true
        outboundDomains:
          - psn.police.uk
          - gcsx.gov.uk
        onPremDnsServers:
          - 192.168.100.10
          - 192.168.100.11
        allowedSourceCidrs:
          - 192.168.100.0/24
          
      peeringConnections: []

  # IPAM Configuration for centralized IP address management
  ipam:
    enabled: true
    region: *HOME_REGION
    operatingRegions:
      - *HOME_REGION
    
    # Global and Regional Pools
    pools:
      - name: "global-pool"
        description: "Global IPAM pool for all regions"
        provisionedCidrs:
          - "10.200.0.0/16"
      - name: "regional-pool-eu-west-2"
        description: "Regional pool for eu-west-2"
        locale: eu-west-2
        sourceIpamPool: "global-pool"
        provisionedCidrs:
          - "10.200.0.0/17"
        shareTargets:
          organizationalUnits:
            - Infrastructure
            - Non-Production
            - Production

################################################################################
# 9. CLOUD FINANCIAL MANAGEMENT CONFIGURATION
################################################################################
cloudFinancialManagement:
  budgets:
    - deploymentTargets:
        accounts:
          - Management
      name: overall-budget
      timeUnit: MONTHLY
      type: COST
      amount: 100000
      includeUpfront: true
      includeTax: true
      includeSupport: true
      includeSubscription: true
      includeRecurring: true
      includeOtherSubscription: true
      includeDiscount: true
      includeCredit: false
      includeRefund: false
      useBlended: false
      useAmortized: false
      unit: GBP
      notifications:
        - type: ACTUAL
          thresholdType: PERCENTAGE
          threshold: 80
          comparisonOperator: GREATER_THAN
          address: finance@council-example.gov.uk
          subscriptionType: EMAIL
        - type: ACTUAL
          thresholdType: PERCENTAGE
          threshold: 100
          comparisonOperator: GREATER_THAN
          address: finance@council-example.gov.uk
          subscriptionType: EMAIL

  # Cost Optimization Services (free tier)
  computeOptimizer:
    enable: true
  costOptimizationHub:
    enable: true

################################################################################
# 8. NETWORK CONFIGURATION
################################################################################
network:
  # High-level network architecture type
  architectureType: TGW  # Transit Gateway architecture for federal agency
  
  # Default VPC handling
  defaultVpc:
    delete: true
    excludeAccounts:
      - Management
  
  # Standard network architecture parameters
  standardArchitecture:
    centralizedNetworking: true
    networkAccount: Network
    region: *HOME_REGION
    
    # High-level VPC structure
    vpcs:
      transitGatewayVpc:
        enabled: true
        availabilityZones: 3
        subnetsPerAZ: 1
        transitGateway: true
        
      endpointVpc:
        enabled: true
        availabilityZones: 3
        subnetsPerAZ: 3  # Regular + TGW attachment + Interface Endpoint subnets
        centralEndpoints: true
        requiredEndpoints:
          - ec2
          - ec2messages
          - ssm
          - ssmmessages
          - kms
          - logs
          - monitoring
          - s3
          - dynamodb
        
      inspectionVpc:
        enabled: true
        availabilityZones: 3
        subnetsPerAZ: 4  # Regular + TGW attachment + Firewall + NAT Gateway subnets
        networkFirewall: true
        firewallPolicy: FedRAMPCompliancePolicy
        
      workloadVpcs:
        enabled: true
        availabilityZones: 3
        subnetsPerAZ: 4  # Web + App + Data + TGW attachment subnets
        deploymentTargets:
          accounts: 
            - PublicServices
            - InternalSystems
            - RegulatedData
            - Development
            - Testing

    # Connectivity options
    connectivity:
      transitGateway:
        enabled: true
        routeTableStructure: segregated
        routeTables:
          - Core
          - Segregated
          - Shared
          - Inspection
          
      hybridConnectivity:
        enabled: true
        type: DirectConnect
        directConnect:
          gateways:
            - name: TIC-Gateway
              asn: 65000
              locations:
                - name: TIC-Location
                  availabilityZones:
                    - us-east-1a
                    - us-east-1b
                  virtualInterfaces:
                    - name: TIC-Interface
                      type: transit
                      owner: Network
                      addressFamily: ipv4
                      amazonAsn: 64512
                      customerAsn: 65000
                      vlan: 100
              
      route53Resolver:
        enabled: true
        outboundDomains:
          - agency.gov
          - internal.mil
        onPremDnsServers:
          - 10.250.0.10
          - 10.250.0.11
        allowedSourceCidrs:
          - 10.250.0.0/16
              
      peeringConnections: []

  # IPAM Configuration for centralized IP address management
  ipam:
    enabled: true
    region: *HOME_REGION
    operatingRegions:
      - *HOME_REGION
      - us-east-2
      - us-west-1
      - us-west-2
    
    # Global and Regional Pools
    pools:
      - name: "global-pool"
        description: "Global IPAM pool for all regions"
        provisionedCidrs:
          - "10.100.0.0/16"
      - name: "regional-pool-us-east-1"
        description: "Regional pool for us-east-1"
        locale: us-east-1
        sourceIpamPool: "global-pool"
        provisionedCidrs:
          - "10.100.0.0/18"
        shareTargets:
          organizationalUnits:
            - Infrastructure
            - Non-Production
            - Production
            - GovCloud
      - name: "regional-pool-us-east-2"
        description: "Regional pool for us-east-2"
        locale: us-east-2
        sourceIpamPool: "global-pool"
        provisionedCidrs:
          - "10.100.64.0/18"
        shareTargets:
          organizationalUnits:
            - Infrastructure
            - Non-Production
            - Production
      - name: "regional-pool-us-west-1"
        description: "Regional pool for us-west-1"
        locale: us-west-1
        sourceIpamPool: "global-pool"
        provisionedCidrs:
          - "10.100.128.0/18"
        shareTargets:
          organizationalUnits:
            - Infrastructure
            - Non-Production
            - Production
      - name: "regional-pool-us-west-2"
        description: "Regional pool for us-west-2"
        locale: us-west-2
        sourceIpamPool: "global-pool"
        provisionedCidrs:
          - "10.100.192.0/18"
        shareTargets:
          organizationalUnits:
            - Infrastructure
            - Non-Production
            - Production

################################################################################
# 9. CLOUD FINANCIAL MANAGEMENT CONFIGURATION
################################################################################
cloudFinancialManagement:
  budgets:
    - deploymentTargets:
        accounts:
          - Management
      name: overall-budget
      timeUnit: MONTHLY
      type: COST
      amount: 1000000
      includeUpfront: true
      includeTax: true
      includeSupport: true
      includeSubscription: true
      includeRecurring: true
      includeOtherSubscription: true
      includeDiscount: true
      includeCredit: false
      includeRefund: false
      useBlended: false
      useAmortized: false
      unit: USD
      notifications:
        - type: ACTUAL
          thresholdType: PERCENTAGE
          threshold: 80
          comparisonOperator: GREATER_THAN
          address: finance@agency-example.gov
          subscriptionType: EMAIL
        - type: ACTUAL
          thresholdType: PERCENTAGE
          threshold: 100
          comparisonOperator: GREATER_THAN
          address: finance@agency-example.gov
          subscriptionType: EMAIL

  # Cost Optimization Services (free tier)
  computeOptimizer:
    enable: true
  costOptimizationHub:
    enable: true

################################################################################
# Generated Titanium.yaml for US Federal Agency
# Generated by Titanium Advisor on 10/07/2025
# Updated for TitaniumV2 format
################################################################################

################################################################################
# 1. GLOBAL CONFIGURATION
################################################################################
homeRegion: &HOME_REGION us-east-1
enabledRegions:
  - *HOME_REGION
  - us-east-2
  - us-west-1
  - us-west-2
managementAccountAccessRole: AWSControlTowerExecution

################################################################################
# 2. CONTROL TOWER CONFIGURATION
################################################################################
controlTower:
  enable: true
  landingZone:
    version: '4.0'
    logging:
      controlTowerOrganizationTrail: true
      loggingBucketRetentionDays: 2557  # 7 years retention for federal records
      accessLoggingBucketRetentionDays: 3650  # 10-year retention for access logs
      organizationTrail: true
    security:
      enableIdentityCenterAccess: true
      denyRegion: true  # Restrict to US regions only
    network:
      networkFactoryConfiguration: null 

################################################################################
# 3. ORGANIZATION CONFIGURATION
################################################################################
organization:
  enable: true
  organizationalUnits:
    - name: Security
    - name: Infrastructure
    - name: GovCloud
    - name: Non-Production
    - name: Production
    - name: Sandbox
    - name: Exceptions
  serviceControlPolicies:
    - name: PreventLeaveOrganization
      description: Prevents accounts from leaving the organization
      policy: service-control-policies/prevent-leave-org.json
      type: customerManaged
      deploymentTargets:
        organizationalUnits:
          - Root
    - name: PreventPublicS3
      description: Prevents creation of public S3 buckets
      policy: service-control-policies/prevent-public-s3.json
      type: customerManaged
      deploymentTargets:
        organizationalUnits:
          - Root
    - name: USRegionsOnly
      description: Restricts services to US regions only
      policy: service-control-policies/us-regions-only.json
      type: customerManaged
      deploymentTargets:
        organizationalUnits:
          - Root
    - name: RequireEncryption
      description: Requires encryption for data storage services
      policy: service-control-policies/require-encryption.json
      type: customerManaged
      deploymentTargets:
        organizationalUnits:
          - Root
  taggingPolicies:
    - name: RequiredTags
      description: Enforces required tags on resources
      policy: tagging-policies/required-tags.json
      deploymentTargets:
        organizationalUnits:
          - Root
  backupPolicies:
    - name: DailyBackups
      enable: true
      description: Daily backups with 35-day retention
      policy: backup-policies/daily-backups.json
      deploymentTargets:
        organizationalUnits:
          - Production
          - GovCloud

################################################################################
# 4. IDENTITY AND ACCESS CONFIGURATION
################################################################################
iamPasswordPolicy:
  allowUsersToChangePassword: true
  hardExpiry: true
  requireUppercaseCharacters: true
  requireLowercaseCharacters: true
  requireSymbols: true
  requireNumbers: true
  minimumPasswordLength: 16  # Enhanced for federal requirements
  passwordReusePrevention: 24
  maxPasswordAge: 60  # Shorter rotation period for federal requirements
accessAnalyzer:
  externalAccess: true
  unusedAccess: true
iamIdentityCenter:
  delegatedAdminAccount: SecurityOperations
  mfaConfiguration:
    mfaRequired: true
  enableABAC: true
  externalProvider:
    enabled: true
    externalProvider: Entra
    samlIntegration: true
    SCIMIntegration: true
  commonRoles:
    - name: NetworkAdmin
      description: Network administration role
      policies:
        - AmazonVPCFullAccess
        - AmazonRoute53FullAccess
      sessionDuration: 3600
    - name: SecurityAdmin
      description: Security administration role
      policies:
        - SecurityAudit
        - AmazonGuardDutyFullAccess
        - AmazonMacieFullAccess
      sessionDuration: 3600
    - name: AuditorRole
      description: Read-only auditor role
      policies:
        - ReadOnlyAccess
        - SecurityAudit
      sessionDuration: 3600
    - name: FISMAComplianceRole
      description: FISMA compliance management role
      policies:
        - AWSConfigUserAccess
        - AmazonInspectorFullAccess
        - AWSSupportAccess
      sessionDuration: 3600

################################################################################
# 5. LOGGING CONFIGURATION
################################################################################
logging:
  account: LogArchive
  cloudtrail:
    managementEventTrail:
      enable: true
      organizationTrail: true
      organizationTrailSettings:
        multiRegionTrail: true
        globalServiceEvents: true
        managementEvents: true
        sendToCloudWatchLogs: true
        apiErrorRateInsight: true
        apiCallRateInsight: true
    dataEventTrail:
      - name: S3DataEvents
        regions:
          - *HOME_REGION
        deploymentTargets:
          organizationalUnits:
            - Security
            - Infrastructure
            - Production
            - GovCloud
        settings:
          multiRegionTrail: true
          globalServiceEvents: true
          managementEvents: false
          s3:
            - resources:
                - arn:aws:s3:::*
              selectors:
                - readOnly: false
                  includeManagementEvents: false
          sendToCloudWatchLogs: true
          apiErrorRateInsight: true
          apiCallRateInsight: true
  sessionManager:
    sendToCloudWatchLogs: true
    sendToS3: true
    lifecycleRules:
      - enabled: true
        abortIncompleteMultipartUpload: 7
        expiration: 2557  # 7 years for federal records
        noncurrentVersionExpiration: 2557  # 7 years for federal records
  cloudWatchLogGroupDefaultRetentionWeeks: 104  # 2 years retention for compliance
  centralLogBucketsAccount:
    account:
      - accountName: Log Archive
        logAccountControls: []

vpcFlowLogs:
  trafficType: ALL
  accounts: []  # Applied to all accounts
  regions:
    - *HOME_REGION
    - us-east-2
    - us-west-1
    - us-west-2
  maxAggregationInterval: 60  # Enhanced monitoring frequency
  destinations:
    - cloud-watch-logs
    - s3
  destinationsConfig:
    cloudWatchLogs:
      retentionInDays: 365
    s3:
      lifecycleRules:
        - enabled: true
          abortIncompleteMultipartUpload: 7
          expiration: 2557  # 7 years for federal records
          noncurrentVersionExpiration: 2557  # 7 years for federal records
  defaultFormat: false
  customFields:
    - version
    - account-id
    - interface-id
    - srcaddr
    - dstaddr
    - srcport
    - dstport
    - protocol
    - packets
    - bytes
    - start
    - end
    - action
    - log-status
    - vpc-id
    - subnet-id
    - instance-id
    - tcp-flags
    - type
    - pkt-srcaddr
    - pkt-dstaddr
    - region
    - az-id
    - sublocation-type
    - sublocation-id
    - pkt-src-aws-service
    - pkt-dst-aws-service
    - flow-direction
    - traffic-path

################################################################################
# 6. SECURITY CONFIGURATION
################################################################################
snsTopics:
  deploymentTargets:
    organizationalUnits:
      - Root
  topics:
    - name: Security
      emailAddresses:
        - security-operations@agency-example.gov
    - name: Compliance
      emailAddresses:
        - compliance@agency-example.gov

centralSecurityServices:
  delegatedAdminAccount: SecurityOperations
  
  # Enhanced AWS Config support - moved from root level for new template compatibility
  awsConfig:
    enableConfigurationRecorder: true
    enableDeliveryChannel: true
    enableGlobalResourceTypes: true  # Maps to IncludeGlobalResourceTypes parameter
    deliveryChannelFrequency: "24hours"  # Maps to Frequency parameter (1hour, 3hours, 6hours, 12hours, 24hours)
    resourceTypes: []  # Used when AllSupported is false
    ruleSets:
      - deploymentTargets:
          organizationalUnits:
            - Root
        rules:
          # NIST 800-53 related rules
          - name: access-keys-rotated
            identifier: ACCESS_KEYS_ROTATED
            complianceResourceTypes: []
          - name: iam-root-access-key-check
            identifier: IAM_ROOT_ACCESS_KEY_CHECK
            complianceResourceTypes: []
          - name: iam-user-mfa-enabled
            identifier: IAM_USER_MFA_ENABLED
            complianceResourceTypes: []
          - name: mfa-enabled-for-iam-console-access
            identifier: MFA_ENABLED_FOR_IAM_CONSOLE_ACCESS
            complianceResourceTypes: []
          - name: root-account-mfa-enabled
            identifier: ROOT_ACCOUNT_MFA_ENABLED
            complianceResourceTypes: []
          - name: encrypted-volumes
            identifier: ENCRYPTED_VOLUMES
            complianceResourceTypes: []
          - name: s3-bucket-public-read-prohibited
            identifier: S3_BUCKET_PUBLIC_READ_PROHIBITED
            complianceResourceTypes: []
          - name: s3-bucket-public-write-prohibited
            identifier: S3_BUCKET_PUBLIC_WRITE_PROHIBITED
            complianceResourceTypes: []
          - name: s3-bucket-ssl-requests-only
            identifier: S3_BUCKET_SSL_REQUESTS_ONLY
            complianceResourceTypes: []
          - name: s3-bucket-server-side-encryption-enabled
            identifier: S3_BUCKET_SERVER_SIDE_ENCRYPTION_ENABLED
            complianceResourceTypes: []
          - name: cloudtrail-enabled
            identifier: CLOUD_TRAIL_ENABLED
            complianceResourceTypes: []
          - name: cloud-trail-encryption-enabled
            identifier: CLOUD_TRAIL_ENCRYPTION_ENABLED
            complianceResourceTypes: []
          - name: cloudtrail-s3-dataevents-enabled
            identifier: CLOUDTRAIL_S3_DATAEVENTS_ENABLED
            complianceResourceTypes: []
          - name: restricted-ssh
            identifier: INCOMING_SSH_DISABLED
            complianceResourceTypes: []
          - name: restricted-common-ports
            identifier: RESTRICTED_INCOMING_TRAFFIC
            complianceResourceTypes: []
  
  ebsDefaultVolumeEncryption:
    enable: true
    excludeRegions: []
  s3PublicAccessBlock:
    enable: true
    excludeAccounts: []
  scpRevertChangesConfig:
    enable: true
    snsTopicName: Security
  macie:
    enable: true
    excludeRegions: []
    policyFindingsPublishingFrequency: FIFTEEN_MINUTES
    publishSensitiveDataFindings: true
    exportConfiguration:
      enable: true
      destinationType: S3
  guardduty:
    enable: true
    excludeRegions: []
    s3Protection:
      enable: true
      excludeRegions: []
    exportConfiguration:
      enable: true
      destinationType: S3
      exportFrequency: FIFTEEN_MINUTES
  auditManager:
    enable: true
    excludeRegions: []
    defaultReportsConfiguration:
      enable: true
      destinationType: S3
    lifecycleRules:
      - enabled: true
        abortIncompleteMultipartUpload: 7
        expiration: 2557  # 7-year retention for audit data
        noncurrentVersionExpiration: 2557  # 7-year retention for audit data
  detective:
    enable: true
    excludeRegions: []
  securityHub:
    enable: true
    regionAggregation: true
    excludeRegions: []
    standards:  # Auto-mapped to template parameters for org configuration
      - name: "AWS Foundational Security Best Practices v1.0.0"
        enable: true    # -> pEnableAFSBPStandard: "true"
      - name: "CIS AWS Foundations Benchmark v1.2.0"
        enable: false   # -> pEnableCIS12Standard: "false"
      - name: "CIS AWS Foundations Benchmark v1.4.0"
        enable: true    # -> pEnableCIS14Standard: "true"
      - name: "NIST Special Publication 800-53 Revision 5"
        enable: true    # -> pEnableNISTStandard: "true"
      - name: "PCI DSS v3.2.1"
        enable: false   # -> pEnablePCIStandard: "false"

cloudWatch:
  metricSets:
    - regions:
        - *HOME_REGION
      deploymentTargets:
        accounts:
          - Management
          - SecurityOperations
          - LogArchive
      metrics:
        # CIS 1.7 – Avoid the use of the "root" account
        - filterName: RootAccountUsageMetricFilter
          logGroupName: aws-controltower/CloudTrailLogs
          filterPattern: '{$.userIdentity.type="Root" && $.userIdentity.invokedBy NOT EXISTS && $.eventType !="AwsServiceEvent"}'
          metricNamespace: LogMetrics
          metricName: RootAccountUsage
          metricValue: "1"
        # CIS 3.1 – Ensure a log metric filter and alarm exist for unauthorized API calls
        - filterName: UnauthorizedAPICallsMetricFilter
          logGroupName: aws-controltower/CloudTrailLogs
          filterPattern: '{($.errorCode="*UnauthorizedOperation") || ($.errorCode="AccessDenied*")}'
          metricNamespace: LogMetrics
          metricName: UnauthorizedAPICalls
          metricValue: "1"
        # CIS 3.2 – Ensure a log metric filter and alarm exist for Management Console sign-in without MFA
        - filterName: NoMFAConsoleSigninMetricFilter
          logGroupName: aws-controltower/CloudTrailLogs
          filterPattern: '{($.eventName="ConsoleLogin") && ($.additionalEventData.MFAUsed !="Yes")}'
          metricNamespace: LogMetrics
          metricName: NoMFAConsoleSignin
          metricValue: "1"
        # Security Group Changes
        - filterName: SecurityGroupChangesMetricFilter
          logGroupName: aws-controltower/CloudTrailLogs
          filterPattern: '{($.eventName=AuthorizeSecurityGroupIngress) || ($.eventName=AuthorizeSecurityGroupEgress) || ($.eventName=RevokeSecurityGroupIngress) || ($.eventName=RevokeSecurityGroupEgress) || ($.eventName=CreateSecurityGroup) || ($.eventName=DeleteSecurityGroup)}'
          metricNamespace: LogMetrics
          metricName: SecurityGroupChanges
          metricValue: "1"
        # Network ACL Changes
        - filterName: NetworkAclChangesMetricFilter
          logGroupName: aws-controltower/CloudTrailLogs
          filterPattern: '{($.eventName=CreateNetworkAcl) || ($.eventName=CreateNetworkAclEntry) || ($.eventName=DeleteNetworkAcl) || ($.eventName=DeleteNetworkAclEntry) || ($.eventName=ReplaceNetworkAclEntry) || ($.eventName=ReplaceNetworkAclAssociation)}'
          metricNamespace: LogMetrics
          metricName: NetworkAclChanges
          metricValue: "1"

  alarmSets:
    - regions:
        - *HOME_REGION
      deploymentTargets:
        accounts:
          - Management
          - SecurityOperations
          - LogArchive
      alarms:
        # CIS 1.7 – Avoid the use of the "root" account
        - alarmName: CIS-1.7-RootAccountUsage
          alarmDescription: Alarm for usage of "root" account
          snsTopicName: Security
          metricName: RootAccountUsage
          namespace: LogMetrics
          comparisonOperator: GreaterThanOrEqualToThreshold
          evaluationPeriods: 1
          period: 300
          statistic: Sum
          threshold: 1
          treatMissingData: notBreaching
        # CIS 3.1 – Ensure a log metric filter and alarm exist for unauthorized API calls
        - alarmName: CIS-3.1-UnauthorizedAPICalls
          alarmDescription: Alarm for unauthorized API calls
          snsTopicName: Security
          metricName: UnauthorizedAPICalls
          namespace: LogMetrics
          comparisonOperator: GreaterThanOrEqualToThreshold
          evaluationPeriods: 1
          period: 300
          statistic: Sum
          threshold: 1
          treatMissingData: notBreaching
        # CIS 3.2 – Ensure a log metric filter and alarm exist for Management Console sign-in without MFA
        - alarmName: CIS-3.2-NoMFAConsoleSignin
          alarmDescription: Alarm for console logins without MFA
          snsTopicName: Security
          metricName: NoMFAConsoleSignin
          namespace: LogMetrics
          comparisonOperator: GreaterThanOrEqualToThreshold
          evaluationPeriods: 1
          period: 300
          statistic: Sum
          threshold: 1
          treatMissingData: notBreaching
        # Security Group Changes
        - alarmName: SecurityGroupChanges
          alarmDescription: Alarm for security group configuration changes
          snsTopicName: Security
          metricName: SecurityGroupChanges
          namespace: LogMetrics
          comparisonOperator: GreaterThanOrEqualToThreshold
          evaluationPeriods: 1
          period: 300
          statistic: Sum
          threshold: 1
          treatMissingData: notBreaching
        # Network ACL Changes
        - alarmName: NetworkAclChanges
          alarmDescription: Alarm for network ACL configuration changes
          snsTopicName: Security
          metricName: NetworkAclChanges
          namespace: LogMetrics
          comparisonOperator: GreaterThanOrEqualToThreshold
          evaluationPeriods: 1
          period: 300
          statistic: Sum
          threshold: 1
          treatMissingData: notBreaching


################################################################################
# STARTER INDUSTRY EXAMPLE - TITANIUM.YAML
# 
# This is an example configuration generated by the "starter" industry overlay.
# It includes only features currently supported by the titanium-generator for
# immediate CloudFormation deployment.
# Updated for TitaniumV2 format
################################################################################

################################################################################
# 1. GLOBAL CONFIGURATION
################################################################################
homeRegion: &HOME_REGION us-east-1
enabledRegions:
  - *HOME_REGION
managementAccountAccessRole: AWSControlTowerExecution

################################################################################
# 2. CONTROL TOWER CONFIGURATION
################################################################################
controlTower:
  enable: true
  landingZone:
    version: '4.0'
    logging:
      controlTowerOrganizationTrail: true
      loggingBucketRetentionDays: 365
      accessLoggingBucketRetentionDays: 3650
      organizationTrail: true
    security:
      enableIdentityCenterAccess: false
      denyRegion: true
    network:
      networkFactoryConfiguration: null

################################################################################
# 3. ORGANIZATION CONFIGURATION
################################################################################
organization:
  enable: true
  organizationalUnits:
    - name: Security
    - name: Infrastructure
    - name: Workloads
    - name: Sandbox
    - name: Exceptions
  serviceControlPolicies:
    - name: PreventLeaveOrganization
      description: Prevents accounts from leaving the organization
      policy: service-control-policies/prevent-leave-org.json
      type: customerManaged
      deploymentTargets:
        organizationalUnits:
          - Root
    - name: PreventPublicS3
      description: Prevents creation of public S3 buckets
      policy: service-control-policies/prevent-public-s3.json
      type: customerManaged
      deploymentTargets:
        organizationalUnits:
          - Root
  taggingPolicies:
    - name: RequiredTags
      description: Enforces required tags on resources
      policy: tagging-policies/required-tags.json
      deploymentTargets:
        organizationalUnits:
          - Root
  backupPolicies:
    - name: DailyBackups
      enable: false
      description: Daily backups with 30-day retention
      policy: backup-policies/daily-backups.json
      deploymentTargets:
        organizationalUnits:
          - Workloads
  resourceControlPolicies: []

################################################################################
# 4. ACCOUNTS CONFIGURATION
################################################################################
accounts:
  mandatoryAccounts:
    - name: Management
      description: The management (primary) account. Do not change the name field for this mandatory account.
      email: management-account@starter-example.com
      organizationalUnit: Root
    - name: LogArchive
      description: The log archive account for centralized logging.
      email: log-archive@starter-example.com
      organizationalUnit: Security
    - name: Audit
      description: The security audit account for compliance monitoring.
      email: audit@starter-example.com
      organizationalUnit: Security
  infrastructureAccounts:
    - name: SharedServices
      description: The SharedServices account for shared resources
      email: shared-services@starter-example.com
      organizationalUnit: Infrastructure
    - name: Network
      description: The Network account for centralized networking
      email: network@starter-example.com
      organizationalUnit: Infrastructure
    - name: Monitoring
      description: The Monitoring account for centralized observability (optional for starter)
      email: monitoring@starter-example.com
      organizationalUnit: Infrastructure

################################################################################
# 5. NETWORK CONFIGURATION
################################################################################
network:
  # High-level network architecture type
  architectureType: TGW
  
  # Default VPC handling
  defaultVpc:
    delete: true
    excludeAccounts: []
  
  # Standard network architecture parameters
  standardArchitecture:
    centralizedNetworking: true
    networkAccount: Network
    region: *HOME_REGION
    
    # High-level VPC structure
    vpcs:
      # Note: Endpoint and Inspection VPCs are disabled as they're not yet supported
      endpointVpc:
        enabled: false
      inspectionVpc:
        enabled: false
      workloadVpcs:
        enabled: true
        availabilityZones: 2
        subnetsPerAZ: 2
        deploymentTargets:
          organizational_units: 
            - Workloads
          accounts: []
    
    # Connectivity options
    connectivity:
      transitGateway:
        enabled: true
        routeTableStructure: segregated
        routeTables:
          - Core
          - Segregated
          - Shared
          - Standalone
      
      # Note: Hybrid connectivity disabled for starter configuration
      hybridConnectivity:
        enabled: false
        type: DirectConnect
      
      # Route53 Resolver separated from hybrid connectivity
      route53Resolver:
        enabled: false
        outboundDomains: []
        onPremDnsServers: []
        allowedSourceCidrs: []

  # IPAM Configuration for centralized IP address management
  ipam:
    enabled: true
    region: *HOME_REGION
    operatingRegions:
      - *HOME_REGION
    
    # Global and Regional Pools
    pools:
      - name: "global-pool"
        description: "Global IPAM pool for starter configuration"
        provisionedCidrs:
          - "10.220.0.0/19"
      - name: "regional-pool-us-east-1"
        description: "Regional pool for us-east-1"
        locale: us-east-1
        sourceIpamPool: "global-pool"
        provisionedCidrs:
          - "10.220.0.0/20"
        shareTargets:
          organizationalUnits:
            - Infrastructure
            - Workloads

################################################################################
# 6. VPC FLOW LOGS CONFIGURATION
################################################################################
vpcFlowLogs:
  trafficType: ALL
  accounts: []
  regions:
    - *HOME_REGION
  maxAggregationInterval: 600
  destinations:
    - s3
  destinationsConfig:
    cloudWatchLogs:
      retentionInDays: 90
  defaultFormat: false

################################################################################
# 7. BASIC SECURITY CONFIGURATION
################################################################################
# Note: Minimal security configuration for starter. Additional services
# (GuardDuty, Security Hub, Macie, etc.) can be added as needed.

centralSecurityServices:
  delegatedAdminAccount: Audit
  
  # Basic AWS Config support
  awsConfig:
    enableConfigurationRecorder: true
    enableDeliveryChannel: true
    enableGlobalResourceTypes: true
    deliveryChannelFrequency: "24hours"
    resourceTypes: []
    ruleSets:
      - deploymentTargets:
          organizationalUnits:
            - Root
        rules:
          - name: iam-root-access-key-check
            identifier: IAM_ROOT_ACCESS_KEY_CHECK
            complianceResourceTypes: []
  
  ebsDefaultVolumeEncryption:
    enable: true
    excludeRegions: []
  
  s3PublicAccessBlock:
    enable: true
    excludeAccounts: []
  
  # Optional security services - disabled for starter to minimize cost
  macie:
    enable: false
  guardduty:
    enable: true
    excludeRegions: []
    s3Protection:
      enable: false
  detective:
    enable: false
  auditManager:
    enable: false
  
  securityHub:
    enable: true
    regionAggregation: false
    excludeRegions: []
    standards:
      - name: "AWS Foundational Security Best Practices v1.0.0"
        enable: true
      - name: "CIS AWS Foundations Benchmark v1.2.0"
        enable: false
      - name: "CIS AWS Foundations Benchmark v1.4.0"
        enable: false
      - name: "NIST Special Publication 800-53 Revision 5"
        enable: false
      - name: "PCI DSS v3.2.1"
        enable: false

################################################################################
# 8. BASIC COST MANAGEMENT
################################################################################
cloudFinancialManagement:
  budgets:
    - deploymentTargets:
        accounts:
          - Management
      name: starter-budget
      timeUnit: MONTHLY
      type: COST
      amount: 1000
      includeUpfront: true
      includeTax: true
      includeSupport: true
      includeSubscription: true
      includeRecurring: true
      includeOtherSubscription: true
      includeDiscount: true
      includeCredit: false
      includeRefund: false
      useBlended: false
      useAmortized: false
      unit: USD
      notifications:
        - type: ACTUAL
          threshold: 80
          thresholdType: PERCENTAGE
          comparisonOperator: GREATER_THAN
          subscriberEmailAddresses:
            - budget-alerts@starter-example.com

  # Cost Optimization Services (free tier)
  computeOptimizer:
    enable: true
  costOptimizationHub:
    enable: true

################################################################################
# FEATURES NOT INCLUDED IN STARTER CONFIGURATION
# 
# The following sections are intentionally omitted or minimized as they are
# optional for a starter configuration:
#
# - iamPasswordPolicy: Advanced IAM settings
# - accessAnalyzer: Advanced access analysis  
# - iamIdentityCenter: SSO configuration (disabled)
# - logging: Advanced CloudTrail and logging configuration
# - snsTopics: SNS notification setup
# - Advanced Security Services: Macie, Detective, Audit Manager (disabled for cost)
# - cloudWatch: Custom metrics and alarms
#
# These features can be enabled as your organization grows and requirements
# increase. They are available in the full-featured examples (uk-council.yaml,
# us-federal.yaml).
################################################################################

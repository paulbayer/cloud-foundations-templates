AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM Password Policy - Organization-wide StackSet'

Metadata:
  DeploymentTarget: "Organization"
  DeploymentType: "StackSet"
  DeploymentOrder: 8
  Prerequisites:
    - "AWS Organizations enabled"
    - "StackSets with Organizations integration enabled"
  Comment: |
    Sets the IAM account password policy in every account across the organization.
    Uses a Lambda-backed Custom Resource because there is no native CloudFormation
    resource type for IAM account password policy.
    
    Deploy to: All accounts (Organization-wide StackSet)

Parameters:
  tMinimumPasswordLength:
    Type: Number
    Description: Minimum number of characters in an IAM user password
    Default: 14
    MinValue: 6
    MaxValue: 128

  tRequireUppercaseCharacters:
    Type: String
    Description: Require at least one uppercase letter
    Default: 'true'
    AllowedValues: ['true', 'false']

  tRequireLowercaseCharacters:
    Type: String
    Description: Require at least one lowercase letter
    Default: 'true'
    AllowedValues: ['true', 'false']

  tRequireSymbols:
    Type: String
    Description: Require at least one non-alphanumeric character
    Default: 'true'
    AllowedValues: ['true', 'false']

  tRequireNumbers:
    Type: String
    Description: Require at least one numeric character
    Default: 'true'
    AllowedValues: ['true', 'false']

  tMaxPasswordAge:
    Type: Number
    Description: Maximum age in days before password must be changed (0 = no expiry)
    Default: 90
    MinValue: 0
    MaxValue: 1095

  tPasswordReusePrevention:
    Type: Number
    Description: Number of previous passwords that cannot be reused
    Default: 24
    MinValue: 0
    MaxValue: 24

  tAllowUsersToChangePassword:
    Type: String
    Description: Allow IAM users to change their own password
    Default: 'true'
    AllowedValues: ['true', 'false']

  tHardExpiry:
    Type: String
    Description: Prevent IAM users from setting a new password after expiration
    Default: 'false'
    AllowedValues: ['true', 'false']

Resources:
  rPasswordPolicyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'titanium-iam-password-policy-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IAMPasswordPolicyPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:UpdateAccountPasswordPolicy
                  - iam:DeleteAccountPasswordPolicy
                  - iam:GetAccountPasswordPolicy
                Resource: '*'

  rPasswordPolicyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'titanium-iam-password-policy-${AWS::Region}'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt rPasswordPolicyLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info(f'Event: {event}')
              try:
                  if event['RequestType'] == 'Delete':
                      logger.info('Delete request - reverting to AWS default password policy')
                      try:
                          iam = boto3.client('iam')
                          iam.delete_account_password_policy()
                          logger.info('Password policy deleted (reverted to default)')
                      except Exception as e:
                          logger.warning(f'Error deleting password policy: {e}')
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  props = event['ResourceProperties']
                  iam = boto3.client('iam')

                  iam.update_account_password_policy(
                      MinimumPasswordLength=int(props['MinimumPasswordLength']),
                      RequireUppercaseCharacters=props['RequireUppercaseCharacters'].lower() == 'true',
                      RequireLowercaseCharacters=props['RequireLowercaseCharacters'].lower() == 'true',
                      RequireSymbols=props['RequireSymbols'].lower() == 'true',
                      RequireNumbers=props['RequireNumbers'].lower() == 'true',
                      MaxPasswordAge=int(props['MaxPasswordAge']),
                      PasswordReusePrevention=int(props['PasswordReusePrevention']),
                      AllowUsersToChangePassword=props['AllowUsersToChangePassword'].lower() == 'true',
                      HardExpiry=props['HardExpiry'].lower() == 'true'
                  )
                  logger.info('Password policy updated successfully')
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

              except Exception as e:
                  logger.error(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  rPasswordPolicyCustomResource:
    Type: Custom::IAMPasswordPolicy
    Properties:
      ServiceToken: !GetAtt rPasswordPolicyLambda.Arn
      MinimumPasswordLength: !Ref tMinimumPasswordLength
      RequireUppercaseCharacters: !Ref tRequireUppercaseCharacters
      RequireLowercaseCharacters: !Ref tRequireLowercaseCharacters
      RequireSymbols: !Ref tRequireSymbols
      RequireNumbers: !Ref tRequireNumbers
      MaxPasswordAge: !Ref tMaxPasswordAge
      PasswordReusePrevention: !Ref tPasswordReusePrevention
      AllowUsersToChangePassword: !Ref tAllowUsersToChangePassword
      HardExpiry: !Ref tHardExpiry

Outputs:
  PasswordPolicyLambdaArn:
    Description: ARN of the IAM Password Policy Lambda
    Value: !GetAtt rPasswordPolicyLambda.Arn
AWSTemplateFormatVersion: "2010-09-09"
Description: "Transit Gateway with Inspection VPC and Network Firewall for Network Account - Provides centralized egress with deep packet inspection"

Metadata:
  Purpose: "Centralized egress architecture with Network Firewall inspection"
  UseCase: "Use this template when you need centralized internet egress WITH deep packet inspection"
  Architecture: "Spoke VPCs → TGW → Inspection VPC (TGW Subnets) → Firewall Endpoints → NAT Gateways → Internet"
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Deployment Controls"
        Parameters:
          - tDeployTransitGateway
          - tDeployInspectionVpc
          - tDeployNetworkFirewall
      - Label:
          default: "Transit Gateway Configuration"
        Parameters:
          - tTransitGatewayASN
          - tAutoAcceptSharedAttachments
      - Label:
          default: "IPAM Configuration"
        Parameters:
          - tDeployIPAM
          - tIPAMNetmaskLength
      - Label:
          default: "Explicit CIDR Configuration"
        Parameters:
          - uInspectionVpcCidr
      - Label:
          default: "Firewall Configuration"
        Parameters:
          - uFirewallName
          - tEnableFirewallLogging
      - Label:
          default: "Logging Configuration"
        Parameters:
          - uVPCFlowLogsBucketName

Parameters:
  # Deployment Controls
  tDeployTransitGateway:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Enable deployment of Transit Gateway (template-controlled)"

  tDeployInspectionVpc:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Enable deployment of Inspection VPC (template-controlled)"

  tDeployNetworkFirewall:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Enable deployment of AWS Network Firewall (template-controlled)"

  # TGW Configuration
  tTransitGatewayASN:
    Type: Number
    Default: 65000
    MinValue: 64512
    MaxValue: 65534
    Description: "BGP ASN for the Transit Gateway (template-controlled)"

  tAutoAcceptSharedAttachments:
    Type: String
    Default: "enable"
    AllowedValues: ["enable", "disable"]
    Description: "Auto-accept shared attachments for Transit Gateway (template-controlled)"

  # IPAM Configuration
  tDeployIPAM:
    Type: String
    Description: "Whether to use IPAM for CIDR allocation (template-controlled)"
    AllowedValues: ["true", "false"]
    Default: "true"

  tIPAMNetmaskLength:
    Type: Number
    Description: "Netmask length for IPAM allocation (template-controlled, e.g., 24 for /24)"
    Default: 24
    MinValue: 16
    MaxValue: 28

  # User-Provided Parameters (used when tDeployIPAM is false)
  uInspectionVpcCidr:
    Type: String
    Description: "Explicit CIDR block for Inspection VPC (user-provided, required when IPAM disabled, e.g., 10.100.2.0/24)"
    Default: ""
    AllowedPattern: "^(|([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2})$"
    ConstraintDescription: "Must be a valid CIDR block (e.g., 10.100.2.0/24) or empty when IPAM is enabled"

  # Cross-Account Integration
  uVPCFlowLogsBucketName:
    Type: String
    Description: "S3 bucket name for VPC flow logs and firewall logs from Log Archive account (user-provided)"
    Default: ""

  # Firewall Configuration
  uFirewallName:
    Type: String
    Default: "aws-network-firewall-001"
    Description: "Name for the AWS Network Firewall (user-provided)"

  tEnableFirewallLogging:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Enable logging for AWS Network Firewall (template-controlled)"

  # Honors the user's vpcFlowLogs.enabled choice. Independent of firewall
  # logging above: when false, no VPC flow log is created even though the bucket
  # still exists for the firewall's logging configuration (#107).
  tEnableVpcFlowLogs:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Create the VPC flow log for this VPC"

Conditions:
  CreateTransitGateway: !Equals [!Ref tDeployTransitGateway, "true"]
  CreateInspectionVPC: !Equals [!Ref tDeployInspectionVpc, "true"]
  CreateNetworkFirewall: !And
    - !Condition CreateInspectionVPC
    - !Equals [!Ref tDeployNetworkFirewall, "true"]
  CreateTransitGatewayAndInspectionVpc: !And
    - !Condition CreateTransitGateway
    - !Condition CreateInspectionVPC
  UseIPAM: !Equals [!Ref tDeployIPAM, "true"]
  UseExplicitCidr: !Equals [!Ref tDeployIPAM, "false"]
  HasExplicitCidr: !Not [!Equals [!Ref uInspectionVpcCidr, ""]]
  EnableFirewallLogs: !And
    - !Condition CreateNetworkFirewall
    - !Equals [!Ref tEnableFirewallLogging, "true"]
  HasFlowLogsBucket: !Not [!Equals [!Ref uVPCFlowLogsBucketName, ""]]
  EnableVpcFlowLogs: !Equals [!Ref tEnableVpcFlowLogs, "true"]
  CreateVpcFlowLogs: !And
    - !Condition EnableVpcFlowLogs
    - !Condition HasFlowLogsBucket
    - !Condition CreateInspectionVPC

Rules:
  ValidateCidrWhenIPAMDisabled:
    RuleCondition: !And
      - !Equals [!Ref tDeployIPAM, "false"]
      - !Equals [!Ref tDeployInspectionVpc, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref uInspectionVpcCidr, ""]]
        AssertDescription: "uInspectionVpcCidr must be provided when IPAM is disabled (tDeployIPAM=false) and Inspection VPC is enabled"

  ValidateNetworkFirewallRequiresBoth:
    RuleCondition: !Equals [!Ref tDeployNetworkFirewall, "true"]
    Assertions:
      - Assert: !Equals [!Ref tDeployTransitGateway, "true"]
        AssertDescription: "Network Firewall requires Transit Gateway to be enabled (tDeployTransitGateway=true)"
      - Assert: !Equals [!Ref tDeployInspectionVpc, "true"]
        AssertDescription: "Network Firewall requires Inspection VPC to be enabled (tDeployInspectionVpc=true)"

Resources:
  # Transit Gateway
  AWSTransitGateway:
    Type: AWS::EC2::TransitGateway
    Condition: CreateTransitGateway
    Properties:
      AmazonSideAsn: !Ref tTransitGatewayASN
      Description: "Transit Gateway for Landing Zone network architecture - Centralized egress with inspection"
      AutoAcceptSharedAttachments: !Ref tAutoAcceptSharedAttachments
      DefaultRouteTableAssociation: "disable"
      DefaultRouteTablePropagation: "enable"
      DnsSupport: "enable"
      VpnEcmpSupport: "enable"
      Tags:
        - Key: Name
          Value: !Sub "tgw-${AWS::Region}-landing-zone-001"
        - Key: Purpose
          Value: "LandingZoneNetworking"
        - Key: Architecture
          Value: "CentralizedEgressWithInspection"

  # TGW Route Table for Inspection Traffic
  TgwRouteTableToInspection:
    Type: AWS::EC2::TransitGatewayRouteTable
    Condition: CreateTransitGateway
    Properties:
      TransitGatewayId: !Ref AWSTransitGateway
      Tags:
        - Key: Name
          Value: "ToInspection"
        - Key: Purpose
          Value: "InspectionTraffic"

  # Inspection VPC with conditional IPAM or explicit CIDR
  InspectionVpc:
    Type: AWS::EC2::VPC
    Condition: CreateInspectionVPC
    Properties:
      # When IPAM enabled: use IPAM pool for CIDR allocation directly on VPC
      # When IPAM disabled: use explicit CIDR block
      CidrBlock: !If 
        - UseExplicitCidr
        - !Ref uInspectionVpcCidr
        - !Ref "AWS::NoValue"
      Ipv4IpamPoolId: !If
        - UseIPAM
        - !Sub "{{resolve:ssm:/network/ipam/regional-pools/${AWS::Region}}}"
        - !Ref "AWS::NoValue"
      Ipv4NetmaskLength: !If
        - UseIPAM
        - !Ref tIPAMNetmaskLength
        - !Ref "AWS::NoValue"
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "vpc-${AWS::Region}-inspection-001"
        - Key: Purpose
          Value: "NetworkInspection"

  # VPC Flow Logs (conditional on bucket availability and VPC creation)
  VpcFlowLogs:
    Type: AWS::EC2::FlowLog
    Condition: CreateVpcFlowLogs
    Properties:
      LogDestination: !Sub "arn:aws:s3:::${uVPCFlowLogsBucketName}/inspection/"
      LogDestinationType: s3
      ResourceId: !Ref InspectionVpc
      ResourceType: VPC
      TrafficType: ALL
      Tags:
        - Key: Name
          Value: "InspectionVPC-FlowLogs"

  # TGW Attachment Subnets (Private)
  TgwSubnetAz1:
    Type: AWS::EC2::Subnet
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      CidrBlock: !Select [0, !Cidr [!GetAtt InspectionVpc.CidrBlock, 8, 4]]
      Tags:
        - Key: Name
          Value: "TGW Attachment Subnet AZ 1"
        - Key: Type
          Value: "Private"

  TgwSubnetAz2:
    Type: AWS::EC2::Subnet
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      CidrBlock: !Select [1, !Cidr [!GetAtt InspectionVpc.CidrBlock, 8, 4]]
      Tags:
        - Key: Name
          Value: "TGW Attachment Subnet AZ 2"
        - Key: Type
          Value: "Private"

  # Firewall Subnets (Private)
  FwInternalSubnetAz1:
    Type: AWS::EC2::Subnet
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      CidrBlock: !Select [2, !Cidr [!GetAtt InspectionVpc.CidrBlock, 8, 4]]
      Tags:
        - Key: Name
          Value: "Firewall Internal Subnet AZ 1"
        - Key: Type
          Value: "Private"

  FwInternalSubnetAz2:
    Type: AWS::EC2::Subnet
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      CidrBlock: !Select [3, !Cidr [!GetAtt InspectionVpc.CidrBlock, 8, 4]]
      Tags:
        - Key: Name
          Value: "Firewall Internal Subnet AZ 2"
        - Key: Type
          Value: "Private"

  # NAT Gateway Subnets (Public)
  NatSubnetAz1:
    Type: AWS::EC2::Subnet
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      CidrBlock: !Select [4, !Cidr [!GetAtt InspectionVpc.CidrBlock, 8, 4]]
      Tags:
        - Key: Name
          Value: "NAT Gateway Public Subnet AZ 1"
        - Key: Type
          Value: "Public"

  NatSubnetAz2:
    Type: AWS::EC2::Subnet
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      CidrBlock: !Select [5, !Cidr [!GetAtt InspectionVpc.CidrBlock, 8, 4]]
      Tags:
        - Key: Name
          Value: "NAT Gateway Public Subnet AZ 2"
        - Key: Type
          Value: "Public"

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateInspectionVPC
    Properties:
      Tags:
        - Key: Name
          Value: "InspectionVPC-IGW"

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      InternetGatewayId: !Ref InternetGateway

  # Elastic IPs for NAT Gateways
  NatGwElasticIp1:
    Type: AWS::EC2::EIP
    Condition: CreateInspectionVPC
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: "NAT-Gateway-EIP-AZ1"

  NatGwElasticIp2:
    Type: AWS::EC2::EIP
    Condition: CreateInspectionVPC
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: "NAT-Gateway-EIP-AZ2"

  # NAT Gateways
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: CreateInspectionVPC
    DependsOn: IgwAttachment
    Properties:
      AllocationId: !GetAtt NatGwElasticIp1.AllocationId
      SubnetId: !Ref NatSubnetAz1
      Tags:
        - Key: Name
          Value: "NAT-Gateway-AZ1"

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: CreateInspectionVPC
    DependsOn: IgwAttachment
    Properties:
      AllocationId: !GetAtt NatGwElasticIp2.AllocationId
      SubnetId: !Ref NatSubnetAz2
      Tags:
        - Key: Name
          Value: "NAT-Gateway-AZ2"

  # TGW Attachment (only created when both TGW and Inspection VPC are deployed)
  TGWAttachment:
    Type: AWS::EC2::TransitGatewayAttachment
    Condition: CreateTransitGatewayAndInspectionVpc
    Properties:
      SubnetIds:
        - !Ref TgwSubnetAz1
        - !Ref TgwSubnetAz2
      TransitGatewayId: !Ref AWSTransitGateway
      VpcId: !Ref InspectionVpc
      Tags:
        - Key: Name
          Value: "Inspection VPC Attachment"

  # AWS Network Firewall
  NetworkFirewall:
    Type: AWS::NetworkFirewall::Firewall
    Condition: CreateNetworkFirewall
    Properties:
      FirewallName: !Ref uFirewallName
      VpcId: !Ref InspectionVpc
      SubnetMappings:
        - SubnetId: !Ref FwInternalSubnetAz1
        - SubnetId: !Ref FwInternalSubnetAz2
      FirewallPolicyArn: !Ref FirewallPolicy
      DeleteProtection: false
      FirewallPolicyChangeProtection: false
      SubnetChangeProtection: false
      Tags:
        - Key: Name
          Value: !Ref uFirewallName
        - Key: Purpose
          Value: "NetworkInspection"

  # Network Firewall Logging
  NetworkFirewallLogging:
    Type: AWS::NetworkFirewall::LoggingConfiguration
    Condition: EnableFirewallLogs
    Properties:
      FirewallArn: !Ref NetworkFirewall
      LoggingConfiguration:
        LogDestinationConfigs:
          - LogDestinationType: "S3"
            LogDestination:
              bucketName: !Ref uVPCFlowLogsBucketName
              prefix: "firewall-logs/"
            LogType: "ALERT"
          - LogDestinationType: "S3"
            LogDestination:
              bucketName: !Ref uVPCFlowLogsBucketName
              prefix: "firewall-logs/"
            LogType: "FLOW"

  # Firewall Policy
  FirewallPolicy:
    Type: AWS::NetworkFirewall::FirewallPolicy
    Condition: CreateNetworkFirewall
    Properties:
      FirewallPolicyName: !Sub "${uFirewallName}-Policy"
      FirewallPolicy:
        StatelessDefaultActions:
          - "aws:forward_to_sfe"
        StatelessFragmentDefaultActions:
          - "aws:forward_to_sfe"
        StatefulRuleGroupReferences:
          - ResourceArn: !Ref FirewallStatefulRuleGroup
      Tags:
        - Key: Name
          Value: !Sub "${uFirewallName}-Policy"

  # Firewall Rule Group
  FirewallStatefulRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Condition: CreateNetworkFirewall
    Properties:
      RuleGroupName: !Sub "${uFirewallName}-StatefulRules"
      Type: STATEFUL
      RuleGroup:
        RulesSource:
          StatefulRules:
            - Action: PASS
              Header:
                Protocol: IP
                Source: "10.0.0.0/8"
                SourcePort: ANY
                Destination: ANY
                DestinationPort: ANY
                Direction: FORWARD
              RuleOptions:
                - Keyword: "sid"
                  Settings: ["1"]
            - Action: PASS
              Header:
                Protocol: TCP
                Source: ANY
                SourcePort: ANY
                Destination: ANY
                DestinationPort: "443"
                Direction: FORWARD
              RuleOptions:
                - Keyword: "sid"
                  Settings: ["2"]
            - Action: PASS
              Header:
                Protocol: TCP
                Source: ANY
                SourcePort: ANY
                Destination: ANY
                DestinationPort: "80"
                Direction: FORWARD
              RuleOptions:
                - Keyword: "sid"
                  Settings: ["3"]
            - Action: DROP
              Header:
                Protocol: IP
                Source: ANY
                SourcePort: ANY
                Destination: ANY
                DestinationPort: ANY
                Direction: FORWARD
              RuleOptions:
                - Keyword: "sid"
                  Settings: ["100"]
      Capacity: 100
      Description: "Stateful rules for network inspection - allows internal traffic, HTTPS, HTTP and drops all other traffic"
      Tags:
        - Key: Name
          Value: !Sub "${uFirewallName}-StatefulRules"

  # Lambda functions for endpoint extraction
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateNetworkFirewall
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Name
          Value: "NetworkFirewall-Endpoint-Extractor-Role"

  NetworkFirewallEndpointsFunction:
    Type: AWS::Lambda::Function
    Condition: CreateNetworkFirewall
    DependsOn: NetworkFirewall
    Properties:
      Description: "Custom resource to extract NetworkFirewall endpoint IDs"
      Handler: index.lambda_handler
      Runtime: python3.13
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      FunctionName: !Sub "Titanium-${uFirewallName}-endpoint-extractor"
      Code:
        ZipFile: |
          import cfnresponse
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event, context):
              logger.info(f'Event: {event}')
              try:
                  endpoint_ids = event['ResourceProperties']['EndpointIds']
                  logger.info(f'Endpoint IDs: {endpoint_ids}')
                  
                  # Extract endpoint IDs and create a mapping
                  response = {}
                  for idx, eid in enumerate(endpoint_ids):
                      # Extract the endpoint ID from the full ARN
                      endpoint_id = eid.split(':')[-1]
                      # Use alphabetic keys (IdA, IdB, etc.)
                      key = f"Id{chr(65 + idx)}"  # 65 is ASCII for 'A'
                      response[key] = endpoint_id
                      logger.info(f'{key}: {endpoint_id}')
                  
                  logger.info(f'Found endpoint IDs: {response}')
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response, "NetworkFirewallEndpoints")
              except Exception as e:
                  logger.error(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
      Tags:
        - Key: Name
          Value: !Sub "Titanium-${uFirewallName}-endpoint-extractor"

  NetworkFirewallEndpoints:
    Type: Custom::NetworkFirewallEndpoints
    Condition: CreateNetworkFirewall
    Properties:
      ServiceToken: !GetAtt NetworkFirewallEndpointsFunction.Arn
      EndpointIds: !GetAtt NetworkFirewall.EndpointIds

  # Route Tables and Routes
  # TGW Subnet AZ1 Route Table: Routes to Firewall Endpoint in AZ1
  TgwSubnetAz1RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      Tags:
        - Key: Name
          Value: "TGW Subnet AZ1 Route Table"

  TgwSubnetAz1DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetworkFirewall
    DependsOn: NetworkFirewallEndpoints
    Properties:
      RouteTableId: !Ref TgwSubnetAz1RouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      VpcEndpointId: !GetAtt NetworkFirewallEndpoints.IdA

  TgwSubnetAz1RtAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateInspectionVPC
    Properties:
      SubnetId: !Ref TgwSubnetAz1
      RouteTableId: !Ref TgwSubnetAz1RouteTable

  # TGW Subnet AZ2 Route Table: Routes to Firewall Endpoint in AZ2
  TgwSubnetAz2RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      Tags:
        - Key: Name
          Value: "TGW Subnet AZ2 Route Table"

  TgwSubnetAz2DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetworkFirewall
    DependsOn: NetworkFirewallEndpoints
    Properties:
      RouteTableId: !Ref TgwSubnetAz2RouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      VpcEndpointId: !GetAtt NetworkFirewallEndpoints.IdB

  TgwSubnetAz2RtAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateInspectionVPC
    Properties:
      SubnetId: !Ref TgwSubnetAz2
      RouteTableId: !Ref TgwSubnetAz2RouteTable

  # Firewall Subnet AZ1 Route Table: Routes to NAT Gateway 1
  FwInternalSubnetAz1RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      Tags:
        - Key: Name
          Value: "Firewall Internal Subnet AZ1 Route Table"

  FwInternalSubnetAz1DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateInspectionVPC
    DependsOn: NatGateway1
    Properties:
      RouteTableId: !Ref FwInternalSubnetAz1RouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway1

  FwInternalSubnetAz1RtAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateInspectionVPC
    Properties:
      SubnetId: !Ref FwInternalSubnetAz1
      RouteTableId: !Ref FwInternalSubnetAz1RouteTable

  # Firewall Subnet AZ2 Route Table: Routes to NAT Gateway 2
  FwInternalSubnetAz2RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      Tags:
        - Key: Name
          Value: "Firewall Internal Subnet AZ2 Route Table"

  FwInternalSubnetAz2DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateInspectionVPC
    DependsOn: NatGateway2
    Properties:
      RouteTableId: !Ref FwInternalSubnetAz2RouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway2

  FwInternalSubnetAz2RtAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateInspectionVPC
    Properties:
      SubnetId: !Ref FwInternalSubnetAz2
      RouteTableId: !Ref FwInternalSubnetAz2RouteTable

  # NAT Gateway Subnet AZ1 Route Table: Routes to Internet Gateway
  NatSubnetAz1RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      Tags:
        - Key: Name
          Value: "NAT Subnet AZ1 Route Table"

  NatSubnetAz1DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateInspectionVPC
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref NatSubnetAz1RouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  NatSubnetAz1RtAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateInspectionVPC
    Properties:
      SubnetId: !Ref NatSubnetAz1
      RouteTableId: !Ref NatSubnetAz1RouteTable

  # NAT Gateway Subnet AZ2 Route Table: Routes to Internet Gateway
  NatSubnetAz2RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateInspectionVPC
    Properties:
      VpcId: !Ref InspectionVpc
      Tags:
        - Key: Name
          Value: "NAT Subnet AZ2 Route Table"

  NatSubnetAz2DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateInspectionVPC
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref NatSubnetAz2RouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  NatSubnetAz2RtAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateInspectionVPC
    Properties:
      SubnetId: !Ref NatSubnetAz2
      RouteTableId: !Ref NatSubnetAz2RouteTable

  # SSM Parameters for cross-stack references
  TransitGatewayIdSSMParameter:
    Type: AWS::SSM::Parameter
    Condition: CreateTransitGateway
    Properties:
      Name: "/network/transit-gateway/id"
      Type: String
      Value: !Ref AWSTransitGateway
      Description: "Transit Gateway ID"
      Tags:
        Purpose: "CrossStackReference"

  InspectionVPCIdSSMParameter:
    Type: AWS::SSM::Parameter
    Condition: CreateInspectionVPC
    Properties:
      Name: "/network/inspection-vpc/id"
      Type: String
      Value: !Ref InspectionVpc
      Description: "Inspection VPC ID"
      Tags:
        Purpose: "CrossStackReference"

  InspectionVPCCidrSSMParameter:
    Type: AWS::SSM::Parameter
    Condition: CreateInspectionVPC
    Properties:
      Name: "/network/inspection-vpc/cidr"
      Type: String
      Value: !GetAtt InspectionVpc.CidrBlock
      Description: "Inspection VPC CIDR block"
      Tags:
        Purpose: "CrossStackReference"

  TGWAttachmentIdSSMParameter:
    Type: AWS::SSM::Parameter
    Condition: CreateTransitGatewayAndInspectionVpc
    Properties:
      Name: "/network/tgw-inspection-attachment/id"
      Type: String
      Value: !Ref TGWAttachment
      Description: "TGW Inspection VPC Attachment ID"
      Tags:
        Purpose: "CrossStackReference"

  TgwRouteTableToInspectionIdSSMParameter:
    Type: AWS::SSM::Parameter
    Condition: CreateTransitGateway
    Properties:
      Name: "/network/tgw-route-table-to-inspection/id"
      Type: String
      Value: !Ref TgwRouteTableToInspection
      Description: "TGW Route Table for Inspection Traffic"
      Tags:
        Purpose: "CrossStackReference"

  NetworkFirewallIdSSMParameter:
    Type: AWS::SSM::Parameter
    Condition: CreateNetworkFirewall
    Properties:
      Name: "/network/network-firewall/id"
      Type: String
      Value: !Ref NetworkFirewall
      Description: "Network Firewall ID"
      Tags:
        Purpose: "CrossStackReference"

  NetworkFirewallArnSSMParameter:
    Type: AWS::SSM::Parameter
    Condition: CreateNetworkFirewall
    Properties:
      Name: "/network/network-firewall/arn"
      Type: String
      Value: !Ref NetworkFirewall
      Description: "Network Firewall ARN"
      Tags:
        Purpose: "CrossStackReference"

Outputs:
  TransitGatewayId:
    Condition: CreateTransitGateway
    Description: "Transit Gateway ID"
    Value: !Ref AWSTransitGateway
    Export:
      Name: !Sub "${AWS::StackName}-TransitGateway-ID"

  InspectionVPCId:
    Condition: CreateInspectionVPC
    Description: "Inspection VPC ID"
    Value: !Ref InspectionVpc
    Export:
      Name: !Sub "${AWS::StackName}-InspectionVPC-ID"

  InspectionVPCCidr:
    Condition: CreateInspectionVPC
    Description: "Inspection VPC CIDR block"
    Value: !GetAtt InspectionVpc.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-InspectionVPC-CIDR"

  NetworkFirewallId:
    Condition: CreateNetworkFirewall
    Description: "AWS Network Firewall ID"
    Value: !Ref NetworkFirewall
    Export:
      Name: !Sub "${AWS::StackName}-NetworkFirewall-ID"

  NetworkFirewallArn:
    Condition: CreateNetworkFirewall
    Description: "AWS Network Firewall ARN"
    Value: !Ref NetworkFirewall
    Export:
      Name: !Sub "${AWS::StackName}-NetworkFirewall-ARN"

  TGWAttachmentId:
    Condition: CreateTransitGatewayAndInspectionVpc
    Description: "TGW Inspection VPC Attachment ID"
    Value: !Ref TGWAttachment
    Export:
      Name: !Sub "${AWS::StackName}-TGWAttachment-ID"

  TgwRouteTableToInspectionId:
    Condition: CreateTransitGateway
    Description: "TGW Route Table for Inspection Traffic"
    Value: !Ref TgwRouteTableToInspection
    Export:
      Name: !Sub "${AWS::StackName}-TgwRouteTableToInspection-ID"

  NatGateway1Id:
    Condition: CreateInspectionVPC
    Description: "NAT Gateway 1 ID (AZ1)"
    Value: !Ref NatGateway1
    Export:
      Name: !Sub "${AWS::StackName}-NatGateway1-ID"

  NatGateway2Id:
    Condition: CreateInspectionVPC
    Description: "NAT Gateway 2 ID (AZ2)"
    Value: !Ref NatGateway2
    Export:
      Name: !Sub "${AWS::StackName}-NatGateway2-ID"

  InternetGatewayId:
    Condition: CreateInspectionVPC
    Description: "Internet Gateway ID"
    Value: !Ref InternetGateway
    Export:
      Name: !Sub "${AWS::StackName}-InternetGateway-ID"

  FirewallEndpointIdAZ1:
    Condition: CreateNetworkFirewall
    Description: "Network Firewall Endpoint ID in AZ1"
    Value: !GetAtt NetworkFirewallEndpoints.IdA
    Export:
      Name: !Sub "${AWS::StackName}-FirewallEndpoint-AZ1"

  FirewallEndpointIdAZ2:
    Condition: CreateNetworkFirewall
    Description: "Network Firewall Endpoint ID in AZ2"
    Value: !GetAtt NetworkFirewallEndpoints.IdB
    Export:
      Name: !Sub "${AWS::StackName}-FirewallEndpoint-AZ2"

  AllocationMethod:
    Condition: CreateInspectionVPC
    Description: "CIDR allocation method used (IPAM or Explicit)"
    Value: !If [UseIPAM, "IPAM", "Explicit"]
    Export:
      Name: !Sub "${AWS::StackName}-AllocationMethod"

  Architecture:
    Description: "Network architecture type"
    Value: "CentralizedEgressWithInspection"
    Export:
      Name: !Sub "${AWS::StackName}-Architecture"

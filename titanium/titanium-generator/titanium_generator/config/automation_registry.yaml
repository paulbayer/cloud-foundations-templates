# Automation Registry — single source of truth for automation coverage
# Status values: fully_automated, partially_automated, manual
# Subsection status values: automated, manual
#
# This registry must reflect every section/subsection present in Titanium.yaml.
# When a section gains template support, update this file — no code changes needed.

